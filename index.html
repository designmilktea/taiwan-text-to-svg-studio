<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>文字造型 SVG Studio｜繁體中文字體與曲線排版</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@300;400;700&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#1d2230;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}.container{max-width:1250px;margin:auto;padding:25px 18px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{margin:0;font-size:clamp(22px,3vw,32px);letter-spacing:-.04em}.subtitle{color:#687287;margin:6px 0 0;font-size:14px}.pill{background:#e8eefe;color:#3547a5;border-radius:40px;padding:7px 12px;font-size:12px;font-weight:700}main{display:grid;grid-template-columns:minmax(320px,380px) minmax(0,1fr);gap:20px}.panel{background:#fff;border:1px solid #e7eaf1;border-radius:18px;box-shadow:0 4px 18px #202d4810}.settings{padding:22px;display:grid;gap:17px;align-content:start}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.meta{float:right;color:#657087;font-variant-numeric:tabular-nums}textarea,select,input[type=number]{font:inherit;width:100%;border:1px solid #d8deea;border-radius:10px;padding:11px;background:white;color:#263047}textarea{min-height:84px;resize:vertical;line-height:1.65}input[type=range]{width:100%;accent-color:#5654db;cursor:pointer}input[type=color]{width:50px;height:40px;border:0;padding:2px;background:none;cursor:pointer}select{cursor:pointer}.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shape{border:1px solid #e0e4ed;background:#fafbfe;border-radius:10px;padding:8px 2px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:pointer;color:#344057;font-size:11px;min-height:74px}.shape svg{width:52px;height:34px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.shape.active{border-color:#5654db;background:#f0efff;color:#4740bf;box-shadow:inset 0 0 0 1px #5654db}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.colorrow{display:flex;align-items:center;gap:10px}.colorrow input[type=text]{width:100%;padding:11px;border:1px solid #d8deea;border-radius:10px;font-family:monospace}.previewpanel{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}.previewhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.previewhead h2{font-size:16px;margin:0}.canvas{background:#fff;border:1px solid #e1e5ee;border-radius:14px;min-height:420px;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(45deg,#f8f9fc 25%,transparent 25%),linear-gradient(-45deg,#f8f9fc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f8f9fc 75%),linear-gradient(-45deg,transparent 75%,#f8f9fc 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}.canvas svg{width:100%;height:auto;display:block;max-height:720px}.actions{display:flex;flex-wrap:wrap;gap:10px}button.action{border:0;border-radius:11px;padding:12px 17px;font-size:14px;cursor:pointer;font-weight:750;background:#5450d8;color:white}button.action.secondary{background:#ecedfa;color:#3733a6}button.action.ghost{background:#f1f3f8;color:#293248}.note{color:#687187;font-size:12px;line-height:1.7}.checkbox{display:flex;align-items:center;gap:8px;font-size:13px;color:#455066}.checkbox input{accent-color:#5450d8}.footerline{border-top:1px solid #eceef3;padding-top:12px}.status{font-size:12px;color:#33675a;min-height:20px}details summary{cursor:pointer;font-size:13px;font-weight:700}details pre{max-height:260px;overflow:auto;padding:12px;border-radius:10px;background:#f4f6fa;font-size:11px;white-space:pre-wrap;word-break:break-all}@media(max-width:850px){main{grid-template-columns:1fr}.canvas{min-height:300px}.settings{order:2}.previewpanel{order:1}}@media(max-width:450px){.container{padding:16px 10px}.settings,.previewpanel{padding:15px}}
</style>
</head><body><div class="container"><header><div><h1>文字造型 SVG Studio</h1><p class="subtitle">繁體中文 Google Fonts ・ 9 種路徑 ・ 即時預覽 ・ SVG 匯出</p></div><div class="pill">TEXT → SVG</div></header>
<main><section class="panel settings">
<div><label for="words">輸入文字 / Text</label><textarea id="words">大安森林公園萬聖野餐派對！</textarea></div>
<div><label>文字形狀 / Text path</label><div class="shapes" id="shapes"></div></div>
<div><label for="font">Google Fonts / 字型</label><select id="font"><option value="Noto Sans TC">思源黑體 · Noto Sans TC</option><option value="Noto Serif TC">思源宋體 · Noto Serif TC</option><option value="LXGW WenKai TC">霞鶩文楷 · LXGW WenKai TC</option><option value="Zen Maru Gothic">Zen Maru Gothic · 圓角風</option><option value="Ma Shan Zheng">Ma Shan Zheng · 手寫風（中文覆蓋有限）</option><option value="sans-serif">系統無襯線 · System Sans</option><option value="serif">系統襯線 · System Serif</option></select><p class="note">Google Fonts 需要網路載入。不同字型的中文字符涵蓋與粗細選項可能不同。</p></div>
<div class="twocol"><div><label for="weight">字重 / Weight</label><select id="weight"><option value="400">Regular 400</option><option value="500">Medium 500</option><option value="700" selected>Bold 700</option><option value="900">Black 900</option></select></div><div><label for="color">字色 / Color</label><div class="colorrow"><input type="color" id="color" value="#192344" aria-label="文字顏色"><input type="text" id="colorHex" value="#192344" maxlength="7" aria-label="HEX 顏色"></div></div></div>
<div><label for="size">字體大小 / Font size <span class="meta" id="sizeValue"></span></label><input type="range" id="size" min="20" max="140" value="60"></div>
<div><label for="radius">造型大小 / Path size <span class="meta" id="radiusValue"></span></label><input type="range" id="radius" min="150" max="390" value="290"></div>
<div><label for="spacing">字距 / Letter spacing <span class="meta" id="spacingValue"></span></label><input type="range" id="spacing" min="-5" max="25" step="1" value="2"></div>
<div><label for="offset">文字起點 / Position <span class="meta" id="offsetValue"></span></label><input type="range" id="offset" min="0" max="100" value="50"></div>
<div class="twocol"><label class="checkbox"><input type="checkbox" id="guide"> 顯示路徑輔助線</label><label class="checkbox"><input type="checkbox" id="stretch"> 文字填滿路徑（封閉造型）</label></div>
<div class="footerline note">輸出的檔案具有透明背景。SVG 文字保持可編輯；若要在不同裝置上完全一致，請於 Inkscape / Illustrator 將文字轉為外框路徑。</div>
</section><section class="panel previewpanel"><div class="previewhead"><h2>即時 SVG 預覽</h2><span class="pill">1000 × 1000</span></div><div class="canvas" id="preview" aria-label="SVG preview"></div><div class="actions"><button class="action" id="download">↓ 下載 SVG</button><button class="action secondary" id="copy">複製 SVG 原始碼</button><button class="action ghost" id="reset">重設</button></div><div class="status" id="status" aria-live="polite"></div><p class="note">圓形、愛心、星形、三角形和矩形是封閉路徑。若字串長度超過路徑可用空間，字可能重疊或無法完整顯示；可減小字體、增大形狀，或使用「文字填滿路徑」。</p><details><summary>檢視 SVG 程式碼</summary><pre id="code"></pre></details></section></main></div>
<script>
const $ = id => document.getElementById(id);
const specs=[['arch','Arch / 上拱','M12 34 Q32 -4 52 34'],['down','Downward / 下弧','M12 4 Q32 43 52 4'],['wave','Wave / 波浪','M5 18 C17 -3 28 41 40 18 S55 -3 62 18'],['circle','Circle / 圓形','M32 3 A26 26 0 1 1 31.99 3'],['straight','Straight / 直線','M5 18 H59'],['heart','Heart / 愛心','M32 38 C-5 13 10 -3 32 9 C54 -3 69 13 32 38Z'],['star','Star / 星形','M32 2 L39 17 L56 19 L44 31 L47 48 L32 40 L17 48 L20 31 L8 19 L25 17Z'],['triangle','Triangle / 三角形','M32 3 L58 45 H6Z'],['rectangle','Rectangle / 矩形','M6 4 H58 V42 H6Z']];
let current='arch';
const shapeContainer=$('shapes');
specs.forEach(([id,label,d])=>{const b=document.createElement('button');b.type='button';b.className='shape';b.dataset.shape=id;b.innerHTML=`<svg viewBox="0 0 64 52" aria-hidden="true"><path d="${d}"/></svg><span>${label}</span>`;b.addEventListener('click',()=>{current=id;render()});shapeContainer.appendChild(b)});
function pointsToPath(pts){return pts.map((p,i)=>`${i?'L':'M'} ${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join(' ')+' Z'}
function getPath(id,r){const c=500;switch(id){case'arch':return `M ${c-r} 565 Q ${c} ${565-r*1.75} ${c+r} 565`;case'down':return `M ${c-r} 405 Q ${c} ${405+r*1.75} ${c+r} 405`;case'wave':return `M ${c-r} 500 C ${c-r*.55} ${500-r*.53} ${c-r*.45} ${500+r*.53} ${c} 500 S ${c+r*.55} ${500-r*.53} ${c+r} 500`;case'straight':return `M ${c-r} 500 H ${c+r}`;case'circle':return `M ${c} ${c-r} A ${r} ${r} 0 1 1 ${c-.01} ${c-r} Z`;case'heart':return `M 500 ${500+r*.76} C ${500-r*1.24} ${500+r*.12} ${500-r*1.05} ${500-r*.95} 500 ${500-r*.27} C ${500+r*1.05} ${500-r*.95} ${500+r*1.24} ${500+r*.12} 500 ${500+r*.76} Z`;case'star':{let a=[];for(let i=0;i<10;i++){let v=(-Math.PI/2)+i*Math.PI/5;let d=i%2?r*.45:r;a.push([500+Math.cos(v)*d,500+Math.sin(v)*d])}return pointsToPath(a)}case'triangle':return pointsToPath([[500,500-r],[500+r*.92,500+r*.78],[500-r*.92,500+r*.78]]);case'rectangle':return pointsToPath([[500-r,500-r*.72],[500+r,500-r*.72],[500+r,500+r*.72],[500-r,500+r*.72]])}}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function isClosed(){return ['circle','heart','star','triangle','rectangle'].includes(current)}
function svgCode(withGuide=false){const d=getPath(current,+$('radius').value);const font=$('font').value;const family=font==='serif'?'serif':font==='sans-serif'?'sans-serif':`'${font}', 'Noto Sans TC', sans-serif`;const text=esc($('words').value || '輸入文字');const fill=$('color').value;const weight=$('weight').value;const fontSize=$('size').value;const spacing=$('spacing').value;const offset=$('offset').value;const stretch=$('stretch').checked&&isClosed();const length=stretch?' textLength="'+Math.max(1,(+$('radius').value*6)).toFixed(0)+'" lengthAdjust="spacing"':'';return `<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="${esc($('words').value)}">\n  <defs><path id="letter-path" d="${d}"/></defs>\n  ${withGuide?`<use href="#letter-path" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 8"/>\n  `:''}<text fill="${fill}" font-family="${esc(family)}" font-size="${fontSize}" font-weight="${weight}" letter-spacing="${spacing}" text-anchor="middle"><textPath href="#letter-path" startOffset="${offset}%"${length}>${text}</textPath></text>\n</svg>`}
function render(){document.querySelectorAll('.shape').forEach(x=>{x.classList.toggle('active',x.dataset.shape===current);x.setAttribute('aria-pressed',String(x.dataset.shape===current))});for(let x of ['size','radius','spacing','offset'])$(x+'Value').textContent=$(x).value+(x==='offset'?'%':' px');$('stretch').disabled=!isClosed();const svg=svgCode($('guide').checked);$('preview').innerHTML=svg;$('code').textContent=svgCode(false)}
for(let id of ['words','font','weight','color','size','radius','spacing','offset','guide','stretch'])$(id).addEventListener('input',()=>{if(id==='color')$('colorHex').value=$('color').value;render()});$('colorHex').addEventListener('change',()=>{const val=$('colorHex').value.trim();if(/^#[0-9a-fA-F]{6}$/.test(val))$('color').value=val;else $('colorHex').value=$('color').value;render()});
function feedback(m){$('status').textContent=m}
$('download').addEventListener('click',()=>{const blob=new Blob([svgCode(false)],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='taiwan-curved-text-'+current+'.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);feedback('SVG 已下載。')});
$('copy').addEventListener('click',async()=>{const t=svgCode(false);try{await navigator.clipboard.writeText(t);feedback('已複製 SVG 原始碼。')}catch(e){const area=document.createElement('textarea');area.value=t;document.body.appendChild(area);area.select();try{document.execCommand('copy');feedback('已複製 SVG 原始碼。')}catch(err){feedback('無法自動複製，請從下方程式碼手動複製。')}area.remove()}});
$('reset').addEventListener('click',()=>{$('words').value='大安森林公園萬聖野餐派對！';$('font').value='Noto Sans TC';$('weight').value='700';$('color').value='#192344';$('colorHex').value='#192344';$('size').value='60';$('radius').value='290';$('spacing').value='2';$('offset').value='50';$('guide').checked=false;$('stretch').checked=false;current='arch';render();feedback('已重設。')});
render();
</script></body></html>
